kind = "web"
previewPath = "/"
title = "Forfaits Internet Gabon"
description = "Site de vente de forfaits internet au Gabon pour les opérateurs Airtel et Moov. Permet d'acheter des forfaits data via Mobile Money (Airtel Money ou Moov Money) grâce à l'API AshtechPay."
version = "1.0.0"
id = "artifacts/forfaits-gabon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23841

[services.development]
run = "pnpm --filter @workspace/forfaits-gabon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forfaits-gabon", "run", "build" ]
serve = "static"
publicDir = "artifacts/forfaits-gabon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23841"
BASE_PATH = "/"
